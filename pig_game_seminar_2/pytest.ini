# pytest.ini
# ==============================================================================
# Pytest Configuration for Pig Game Project
# Ensures clean test output and consistent environment across all systems.
# ==============================================================================

[pytest]
# Always include src in Python path so imports like "from src.game import Game" work everywhere
pythonpath = pig_game

addopts = --cov=src --cov-report=term-missing
testpaths = tests

# Ignore benign runtime warnings (e.g., double-import when testing __main__)
filterwarnings =
    ignore:'src.game' found in sys.modules after import of package 'src':RuntimeWarning
    ignore:'src.game_cmd' found in sys.modules after import of package 'src':RuntimeWarning
    ignore:.*found in sys\.modules after import of package.*:RuntimeWarning

# Enable UTF-8 encoding for Windows terminals
python_files = test_*.py
